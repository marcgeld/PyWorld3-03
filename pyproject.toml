[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyworld3"
version = "1.1"
description = "The World3 model revisited in Python, updated to World3-03."
readme = "README.md"
requires-python = ">=3.14"
license = "CECILL-2.1"
authors = [{name = "Charles Vanwynsberghe"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
pyworld3 = "pyworld3.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pyworld3"]

[tool.setuptools.package-data]
pyworld3 = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
